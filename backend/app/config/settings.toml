# Portable checked-in defaults. Override values with LOCALAI_* environment variables
# or set LOCALAI_CONFIG to a private TOML file. See settings.example.toml and README.
[app]
name = "LocalAIContent"
version = "0.1.0"
host = "127.0.0.1"
port = 8000
# This bundled default resolves relative paths from the repository root. A TOML
# selected with LOCALAI_CONFIG instead resolves relative paths from its own directory.
projects_root = "projects"

[runtime.lmstudio]
base_url = "http://127.0.0.1:1234/v1"
gpu = 0
request_timeout_s = 300
# This must exactly match an ID returned by GET /v1/models; preflight reports a mismatch.
default_model = "qwen3-coder-30b-a3b-instruct"
vision_model = "qwen2.5-vl-32b-instruct"

[runtime.comfyui]
base_url = "http://127.0.0.1:8188"
gpu = 1
poll_interval_s = 2
request_timeout_s = 7200
# Native ComfyUI API workflows committed in comfyui/workflows.
workflow_image = "flux_dev_fp8"
workflow_i2v = "wan21_i2v_14b_fp8"
workflow_t2v = "wan21_t2v_14b_fp8"
# Reference-image/PuLID/upscale workflow variants are deliberately disabled until
# their exported native workflow files are supplied and preflighted.
workflow_image_img2img = ""
workflow_image_pulid = ""
workflow_upscale = ""

[runtime.tts]
engine = "kokoro"
base_url = "http://127.0.0.1:9880"
default_voice = "af_heart"
sample_rate = 24000

[runtime.ffmpeg]
# Resolve from PATH. On Windows, install FFmpeg or set LOCALAI_FFMPEG_BINARY / LOCALAI_FFPROBE_BINARY.
binary = "ffmpeg"
ffprobe_binary = "ffprobe"
default_video_codec = "libx264"
default_audio_codec = "aac"
default_image_format = "webp"
# Hard deadline for every ffmpeg/ffprobe child process; timeout kills the child.
process_timeout_s = 7200

[social_master]
# Versioned profile persisted with every rendered output for reproducibility.
profile_id = "vertical-social-h264-aac-rec709"
profile_version = "1.0.0"
width = 1080
height = 1920
fps = 30
duration_s = 30.0
video_codec = "libx264"
video_bitrate = "10M"
audio_codec = "aac"
audio_bitrate = "224k"
audio_sample_rate = 48000
audio_channels = 2
pix_fmt = "yuv420p"
color_space = "bt709"
color_primaries = "bt709"
color_trc = "bt709"

[vram]
strategy = "auto_split"
gpu0_capacity_mb = 24576
gpu1_capacity_mb = 24576
reserve_mb = 2048
sequential_phasing = true

[acceptance]
# Leave empty in tracked examples. For real acceptance, prefer the private
# LOCALAI_ACCEPTANCE_SIGNING_SECRET environment variable (or a gitignored local config).
signing_secret = ""

[provenance]
# Bump only when the persisted metadata contract changes incompatibly.
schema_version = 1
