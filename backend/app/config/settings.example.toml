# Copy this file outside the repository (or to settings.local.toml), customize it,
# then launch with LOCALAI_CONFIG=/absolute/path/to/settings.local.toml.
# When selected through LOCALAI_CONFIG, a relative app.projects_root is resolved
# from this TOML file's directory. Use an absolute path to opt out.
# Alternatively override one value without a private file:
#   LOCALAI_PROJECTS_ROOT=D:\AIOS\development\song_writer\projects
#   LOCALAI_RUNTIME__LMSTUDIO__DEFAULT_MODEL=exact-loaded-model-id
#   LOCALAI_FFMPEG_BINARY=ffmpeg.exe
# Values below are portable defaults; they contain no machine-specific paths or secrets.

[app]
name = "song_writer"
version = "0.1.0"
host = "127.0.0.1"
port = 7664
projects_root = "projects"
profiles_root = "profiles"

[runtime.lmstudio]
base_url = "http://127.0.0.1:1234/v1"
gpu = 0
request_timeout_s = 300
default_model = "qwen3-coder-30b-a3b-instruct"
vision_model = "qwen2.5-vl-32b-instruct"

[runtime.comfyui]
base_url = "http://127.0.0.1:8188"
gpu = 1
poll_interval_s = 2
request_timeout_s = 7200
workflow_image = "flux_dev_fp8"
workflow_i2v = "wan21_i2v_14b_fp8"
workflow_t2v = "wan21_t2v_14b_fp8"
workflow_image_img2img = ""
workflow_image_pulid = ""
workflow_upscale = ""

[runtime.tts]
engine = "kokoro"
base_url = "http://127.0.0.1:9880"
default_voice = "af_heart"
sample_rate = 24000

[runtime.ffmpeg]
binary = "ffmpeg"
ffprobe_binary = "ffprobe"
default_video_codec = "libx264"
default_audio_codec = "aac"
default_image_format = "webp"
process_timeout_s = 7200

[social_master]
profile_id = "vertical-social-h264-aac-rec709"
profile_version = "1.0.0"
width = 1080
height = 1920
fps = 30
duration_s = 30.0
video_codec = "libx264"
video_bitrate = "10M"
audio_codec = "aac"
audio_bitrate = "224k"
audio_sample_rate = 48000
audio_channels = 2
pix_fmt = "yuv420p"
color_space = "bt709"
color_primaries = "bt709"
color_trc = "bt709"

[vram]
strategy = "auto_split"
gpu0_capacity_mb = 24576
gpu1_capacity_mb = 24576
reserve_mb = 2048
sequential_phasing = true

[acceptance]
# Leave empty in tracked examples. For real acceptance, prefer the private
# LOCALAI_ACCEPTANCE_SIGNING_SECRET environment variable (or a gitignored local config).
signing_secret = ""

[audiobook]
# Phase 1 live-generation hold. While false, the audiobook API refuses real TTS
# render requests server-side; deterministic fake synthesis used by isolated
# tests is unaffected.
live_generation_authorized = false

[music]
# ACE-Step 1.5 is the selected local music runtime. Keep live generation false
# until a dedicated process is explicitly authorized for a bounded submission.
live_generation_authorized = false
# Set true only after an explicitly approved capacity-preparation step verifies
# enough free physical GPU1 memory for the selected ACE-Step workflow.
capacity_verified = false
# Process-scoped experimental authorization. This is NOT verified capacity and
# must never be presented as capacity proof. The explicit -Music startup mode
# sets this only in its own process; ordinary startup keeps it false.
capacity_override_authorized = false
# Section-level repaint integration (offline). Submission remains refused while
# repaint_enabled is false; the first model load additionally requires a
# separately approved capacity gate. No model loads at installation time.
repaint_enabled = false
repaint_service_url = "http://127.0.0.1:8021"
repaint_output_format = "wav32"
repaint_crossfade_ms = 10
repaint_min_free_vram_mib = 6144
repaint_fake_provider = false
engine = "ace-step-1.5"
checkpoint = "ace_step_1.5_turbo_aio.safetensors"
checkpoint_sha256 = "67b0f43aa5c51c840bd0228e6a935d8ff416ec87e5df2fc0637da17a561252bc"
workflow = "ace_step_1_5_aio"
max_submission_cap = 4
default_duration_s = 30.0
# Section names preflight checks recognize in [bracketed] lyric tags.
known_sections = [
  "intro", "verse", "pre-chorus", "chorus", "post-chorus", "bridge",
  "outro", "inst", "instrumental", "hook", "breakdown", "interlude",
]
# Estimated seconds sung per non-tag lyric line, for preflight density checks.
preflight_seconds_per_line = 6.0
# Registry caps for stored critique summaries and alternative lyric variants.
max_critiques = 20
max_variants = 30
# Drop-oldest cap for per-project song revision snapshots.
max_revisions = 30

[provenance]
schema_version = 1
